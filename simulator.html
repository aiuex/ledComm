<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED Simulator</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#1e1e1e;
    color:white;
    font-family:Arial,sans-serif;
}

.container{
    display:flex;
    gap:30px;
    padding:20px;
}

.display-area{
    flex:0 0 420px;
}

.control-area{
    flex:1;
}

.toolbar{
    margin-bottom:20px;
}

button{
    padding:10px 20px;
    margin-right:10px;
    cursor:pointer;
}

.display-wrapper{
    display:flex;
    justify-content:center;
}

.display-panel{
    width:220px;
    background:#111;
    border:2px solid #444;
    border-radius:8px;
    padding:20px 0;
}

.led-row{
    display:flex;
    align-items:center;
    height:60px;
    margin:10px 0;
}

.led{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#111;
    border:1px solid #333;
    margin-left:25px;
}

.label{
    font-size:18px;
    color:#bbb;
    margin-left:20px;
    font-family:monospace;
}

.led-config{
    background:#2a2a2a;
    margin-bottom:15px;
    padding:15px;
    border-radius:8px;
}

.led-config h3{
    margin-top:0;
}

.pattern{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:10px;
}

.pattern label{
    display:flex;
    flex-direction:column;
    align-items:center;
}

input[type=range]{
    width:250px;
}

.display-mode .control-area{
    display:none;
}

.display-mode .display-area{
    flex:1;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.display-mode .display-panel{
    transform:scale(4);
}
</style>
</head>

<body>

<div class="container">

    <div class="display-area">

        <div class="toolbar">
            <button onclick="startSimulation()">START</button>
            <button onclick="stopSimulation()">STOP</button>
            <button onclick="toggleDisplayMode()">
                撮影モード
            </button>
        </div>

        <div class="display-wrapper">

            <div class="display-panel">

                <div class="led-row">
                    <div class="led" id="led0"></div>
                    <div class="label">PWR</div>
                </div>

                <div class="led-row">
                    <div class="led" id="led1"></div>
                    <div class="label">ERR</div>
                </div>

                <div class="led-row">
                    <div class="led" id="led2"></div>
                    <div class="label">OSSD</div>
                </div>

                <div class="led-row">
                    <div class="led" id="led3"></div>
                    <div class="label">ALIGN</div>
                </div>

            </div>

        </div>

    </div>

    <div class="control-area" id="controlArea"></div>

</div>

<script>

const leds=[];

for(let i=0;i<4;i++){

    const div=document.createElement("div");

    div.className="led-config";

    div.innerHTML=`
        <h3>LED ${i+1}</h3>

        <div>
            色：
            <select id="color${i}">
                <option value="red">赤</option>
                <option value="orange">オレンジ</option>
                <option value="lime">緑</option>
            </select>
        </div>

        <br>

        <div>
            ステップ時間：
            <input
                id="period${i}"
                type="range"
                min="10"
                max="500"
                value="100">
            <span id="periodText${i}">
            100
            </span>ms
        </div>

        <div class="pattern">

            ${Array.from({length:6}).map((_,idx)=>`
                <label>
                    ${idx+1}
                    <input
                     checked
                     id="p${i}_${idx}"
                     type="checkbox">
                </label>
            `).join("")}

        </div>
    `;

    document
        .getElementById("controlArea")
        .appendChild(div);

    document
        .getElementById(`period${i}`)
        .addEventListener("input",e=>{

            document.getElementById(
                `periodText${i}`
            ).textContent=e.target.value;

        });

    leds.push({
        step:0,
        timer:null
    });
}

function getColor(color){

    if(color==="red"){
        return "#ff3030";
    }

    if(color==="orange"){
        return "#ff9900";
    }

    return "#00ff55";
}

function updateLed(index,state){

    const led=
    document.getElementById(
        `led${index}`
    );

    const color=
    document.getElementById(
        `color${index}`
    ).value;

    if(state){

        const c=getColor(color);

        led.style.background=c;

        led.style.boxShadow=
        `
        0 0 5px ${c},
        0 0 10px ${c},
        0 0 20px ${c}
        `;

    }else{

        led.style.background="#111";
        led.style.boxShadow="none";
    }
}

function runLed(index){

    function next(){

        const step=
        leds[index].step;

        const on=

        document.getElementById(
            `p${index}_${step}`
        ).checked;

        updateLed(index,on);

        leds[index].step=
        (step+1)%6;

        const period=
        Number(
        document.getElementById(
            `period${index}`
        ).value);

        leds[index].timer=
        setTimeout(next,period);
    }

    next();
}

function startSimulation(){

    stopSimulation();

    for(let i=0;i<4;i++){

        leds[i].step=0;

        runLed(i);
    }
}

function stopSimulation(){

    for(let i=0;i<4;i++){

        clearTimeout(
            leds[i].timer
        );

        updateLed(i,false);
    }
}

function toggleDisplayMode(){

    document.body.classList.toggle(
        "display-mode"
    );
}

</script>

</body>
</html>
