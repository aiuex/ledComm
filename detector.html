<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2 LED Detector</title>

<style>
body{
    margin:0;
    padding:10px;
    background:#111;
    color:white;
    font-family:sans-serif;
}

video{
    width:100%;
    border-radius:8px;
}

.video-wrap{
    position:relative;
}

.roi{
    position:absolute;
    border:2px solid lime;
    width:20px;
    height:20px;
    left:50%;
    transform:translateX(-50%);
}

#roi1{
    top:42%;
}
#roi2{
    top:58%;
}

canvas{
    width:100%;
    background:black;
    border-radius:8px;
    margin-top:8px;
}

.card{
    background:#222;
    padding:6px;
    border-radius:6px;
    margin-top:8px;
}

.stats{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
}

.status-on{
    color:#00ff55;
}

.status-off{
    color:#ff5555;
}

input[type=range]{
    width:100%;
}
</style>
</head>
<body>

<h3>2 LED Detector</h3>

<button id="startBtn">
カメラ開始
</button>

<div class="video-wrap">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <div class="roi" id="roi1"></div>
    <div class="roi" id="roi2"></div>

</div>

<canvas
    id="graph"
    width="800"
    height="250">
</canvas>

<div class="card">

ROIサイズ
<span id="roiValue">20</span>

<input
type="range"
id="roiSize"
min="3"
max="50"
value="20">

</div>

<div class="card">

閾値
<span id="thresholdValue">80</span>

<input
type="range"
id="threshold"
min="0"
max="255"
value="80">

</div>

<div class="stats">

<div class="card">
LED1<br>
Brightness:
<span id="b1">0</span><br>
State:
<span id="s1">---</span>
</div>

<div class="card">
LED2<br>
Brightness:
<span id="b2">0</span><br>
State:
<span id="s2">---</span>
</div>

<div class="card">
FPS<br>
<span id="fps">-</span>
</div>

<div class="card">
Diff<br>
<span id="diff">-</span>
</div>

</div>

<script>

const video =
document.getElementById("video");

const graph =
document.getElementById("graph");

const ctx =
graph.getContext("2d");

const workCanvas =
document.createElement("canvas");

const workCtx =
workCanvas.getContext("2d");

const roiSlider =
document.getElementById("roiSize");

const thresholdSlider =
document.getElementById("threshold");

let history1=[];
let history2=[];

let frameCount=0;
let lastFps=performance.now();

roiSlider.addEventListener(
"input",
()=>{

    const size=
    roiSlider.value;

    document.getElementById(
        "roiValue"
    ).textContent=size;

    document
    .querySelectorAll(".roi")
    .forEach(r=>{

        r.style.width=
        size+"px";

        r.style.height=
        size+"px";

    });

});

thresholdSlider.addEventListener(
"input",
()=>{
    document.getElementById(
        "thresholdValue"
    ).textContent=
    thresholdSlider.value;
}
);

async function startCamera(){

    const stream=
    await navigator
    .mediaDevices
    .getUserMedia({

        video:{
            facingMode:"environment"
        }

    });

    video.srcObject=
    stream;

    video.onloadedmetadata=
    ()=>{

        workCanvas.width=
        video.videoWidth;

        workCanvas.height=
        video.videoHeight;

        requestAnimationFrame(
            analyze
        );
    };
}

document
.getElementById("startBtn")
.addEventListener(
"click",
startCamera
);

function roiBrightness(cx,cy,size){

    const image=
    workCtx.getImageData(
        cx-size/2,
        cy-size/2,
        size,
        size
    );

    let sum=0;

    for(
        let i=0;
        i<image.data.length;
        i+=4
    ){

        sum+=
        (
        image.data[i]
        +
        image.data[i+1]
        +
        image.data[i+2]
        )/3;
    }

    return sum/
    (image.data.length/4);
}

function analyze(){

    workCtx.drawImage(
        video,
        0,
        0,
        workCanvas.width,
        workCanvas.height
    );

    const roiSize=
    Number(
        roiSlider.value
    );

    const cx=
    workCanvas.width/2;

    const b1=
    roiBrightness(
        cx,
        workCanvas.height*0.42,
        roiSize
    );

    const b2=
    roiBrightness(
        cx,
        workCanvas.height*0.58,
        roiSize
    );

    history1.push(b1);
    history2.push(b2);

    if(history1.length>300){

        history1.shift();
        history2.shift();
    }

    const threshold=
    Number(
        thresholdSlider.value
    );

    document
    .getElementById("b1")
    .textContent=
    b1.toFixed(1);

    document
    .getElementById("b2")
    .textContent=
    b2.toFixed(1);

    const s1=
    b1>threshold;

    const s2=
    b2>threshold;

    document
    .getElementById("s1")
    .textContent=
    s1?"ON":"OFF";

    document
    .getElementById("s2")
    .textContent=
    s2?"ON":"OFF";

    document
    .getElementById("s1")
    .className=
    s1?
    "status-on":
    "status-off";

    document
    .getElementById("s2")
    .className=
    s2?
    "status-on":
    "status-off";

    document
    .getElementById("diff")
    .textContent=
    Math.abs(
        b1-b2
    ).toFixed(1);

    drawGraph(
        threshold
    );

    frameCount++;

    const now=
    performance.now();

    if(
        now-lastFps>1000
    ){

        document
        .getElementById("fps")
        .textContent=
        (
        frameCount*1000/
        (now-lastFps)
        ).toFixed(1);

        frameCount=0;

        lastFps=now;
    }

    requestAnimationFrame(
        analyze
    );
}

function drawGraph(
threshold
){

    ctx.clearRect(
        0,
        0,
        graph.width,
        graph.height
    );

    const all=
    history1.concat(
        history2
    );

    if(all.length<2)
        return;

    const min=
    Math.min(...all)-5;

    const max=
    Math.max(...all)+5;

    const scale=
    Math.max(
        max-min,
        1
    );

    drawLine(
        history1,
        "#00ff55",
        min,
        scale
    );

    drawLine(
        history2,
        "#ffff00",
        min,
        scale
    );

    const ty=
    graph.height
    -
    (
    (threshold-min)
    /scale
    )
    *
    graph.height;

    ctx.strokeStyle=
    "red";

    ctx.beginPath();

    ctx.moveTo(0,ty);
    ctx.lineTo(graph.width,ty);

    ctx.stroke();
}

function drawLine(
history,
color,
min,
scale
){

    ctx.strokeStyle=
    color;

    ctx.beginPath();

    history.forEach(
    (v,i)=>{

        const x=
        i*
        graph.width/
        history.length;

        const y=
        graph.height
        -
        (
        (v-min)
        /scale
        )
        *
        graph.height;

        if(i===0)
            ctx.moveTo(x,y);
        else
            ctx.lineTo(x,y);

    });

    ctx.stroke();
}

</script>

</body>
</html>
