<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED Detector</title>

<style>
body{
    margin:0;
    background:#111;
    color:white;
    font-family:sans-serif;
}

h1{
    text-align:center;
    font-size:20px;
}

#container{
    max-width:900px;
    margin:auto;
    padding:10px;
}

.video-wrap{
    position:relative;
}

video{
    width:100%;
    background:black;
}

.target{
    position:absolute;
    width:40px;
    height:40px;
    border:2px solid lime;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.stats{
    margin-top:10px;
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.card{
    background:#222;
    padding:10px;
    border-radius:8px;
}

canvas{
    width:100%;
    height:150px;
    background:black;
    margin-top:10px;
}

button{
    padding:10px 20px;
    margin:10px 0;
}

input[type=range]{
    width:100%;
}

.status-on{
    color:#00ff55;
    font-weight:bold;
}

.status-off{
    color:#ff5555;
    font-weight:bold;
}
</style>
</head>
<body>

<div id="container">

<h1>LED Detector</h1>

<button id="startBtn">カメラ開始</button>

<div class="video-wrap">
    <video id="video" autoplay playsinline></video>
    <div class="target"></div>
</div>

<div class="stats">

    <div class="card">
        輝度<br>
        <span id="brightness">0</span>
    </div>

    <div class="card">
        状態<br>
        <span id="state">---</span>
    </div>

    <div class="card">
        推定周期<br>
        <span id="period">---</span>
    </div>

    <div class="card">
        推定周波数<br>
        <span id="freq">---</span>
    </div>

    <div class="card">
        FPS<br>
        <span id="fps">---</span>
    </div>

    <div class="card">
        閾値<br>
        <input
            type="range"
            id="threshold"
            min="0"
            max="255"
            value="80">
        <span id="thresholdValue">80</span>
    </div>

    <div class="card">
        閾値との差分<br>
        <span id="diff">0</span>
    </div>

</div>

<canvas id="graph" width="800" height="200"></canvas>

</div>

<script>

const video=document.getElementById("video");

const graph=document.getElementById("graph");
const ctx=graph.getContext("2d");

const workCanvas=document.createElement("canvas");
const workCtx=workCanvas.getContext("2d");

const thresholdSlider=
document.getElementById("threshold");

const thresholdValue=
document.getElementById("thresholdValue");

thresholdSlider.addEventListener(
    "input",
    ()=>{
        thresholdValue.textContent=
        thresholdSlider.value;
    }
);

let history=[];
let transitions=[];

let prevState=null;

let frameCount=0;
let lastFpsTime=performance.now();

document
.getElementById("startBtn")
.addEventListener(
    "click",
    startCamera
);

async function startCamera(){

    const stream=
    await navigator.mediaDevices.getUserMedia({

        video:{
            facingMode:"environment"
        }

    });

    video.srcObject=stream;

    video.onloadedmetadata=()=>{

        workCanvas.width=
        video.videoWidth;

        workCanvas.height=
        video.videoHeight;

        requestAnimationFrame(analyze);
    };
}

function analyze(){

    if(video.videoWidth===0){

        requestAnimationFrame(analyze);
        return;
    }

    workCtx.drawImage(
        video,
        0,
        0,
        workCanvas.width,
        workCanvas.height
    );

    const size=20;

    const x=
    workCanvas.width/2-size/2;

    const y=
    workCanvas.height/2-size/2;

    const image=
    workCtx.getImageData(
        x,
        y,
        size,
        size
    );

    let sum=0;

    for(
        let i=0;
        i<image.data.length;
        i+=4
    ){

        const r=image.data[i];
        const g=image.data[i+1];
        const b=image.data[i+2];

        sum+=(r+g+b)/3;
    }

    const brightness=
    sum/(image.data.length/4);

    document
    .getElementById("brightness")
    .textContent=
    brightness.toFixed(1);

    const threshold=
    Number(
        thresholdSlider.value
    );

    const diff=
    brightness-threshold;

    document
    .getElementById("diff")
    .textContent=
    diff.toFixed(1);

    const state=
    brightness>threshold;

    document
    .getElementById("state")
    .textContent=
    state ? "ON" : "OFF";

    document
    .getElementById("state")
    .className=
    state ?
    "status-on" :
    "status-off";

    const now=
    performance.now();

    if(
        prevState!==null &&
        prevState!==state
    ){

        transitions.push(now);

        if(
            transitions.length>10
        ){
            transitions.shift();
        }

        calculateFrequency();
    }

    prevState=state;

    history.push(brightness);

    if(history.length>300){

        history.shift();
    }

    drawGraph(threshold);

    frameCount++;

    if(
        now-lastFpsTime>1000
    ){

        const fps=
        frameCount*1000 /
        (now-lastFpsTime);

        document
        .getElementById("fps")
        .textContent=
        fps.toFixed(1);

        frameCount=0;

        lastFpsTime=now;
    }

    requestAnimationFrame(
        analyze
    );
}

function calculateFrequency(){

    if(
        transitions.length<4
    ){
        return;
    }

    const periods=[];

    for(
        let i=2;
        i<transitions.length;
        i++
    ){

        periods.push(

            transitions[i]-
            transitions[i-2]

        );
    }

    const avg=

    periods.reduce(
        (a,b)=>a+b,
        0
    ) / periods.length;

    document
    .getElementById("period")
    .textContent=
    avg.toFixed(0)+" ms";

    document
    .getElementById("freq")
    .textContent=
    (1000/avg)
    .toFixed(2)
    +" Hz";
}

function drawGraph(threshold){

    ctx.clearRect(
        0,
        0,
        graph.width,
        graph.height
    );

    ctx.strokeStyle="#00ff55";

    ctx.beginPath();

    history.forEach(
        (v,i)=>{

        const x=
        i*
        (
            graph.width/
            history.length
        );

        const y=
        graph.height-
        (v/255*
        graph.height);

        if(i===0){

            ctx.moveTo(x,y);

        }else{

            ctx.lineTo(x,y);
        }
    });

    ctx.stroke();

    const thresholdY=
    graph.height-
    (
        threshold/255*
        graph.height
    );

    ctx.strokeStyle="red";

    ctx.beginPath();

    ctx.moveTo(
        0,
        thresholdY
    );

    ctx.lineTo(
        graph.width,
        thresholdY
    );

    ctx.stroke();
}

</script>

</body>
</html>
