<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LED Detector</title>

<style>

body{
    margin:0;
    padding:10px;
    background:#111;
    color:white;
    font-family:sans-serif;
}

h2{
    margin:0 0 10px 0;
    text-align:center;
    font-size:18px;
}

button{
    padding:10px 16px;
    margin-bottom:10px;
}

.video-wrap{
    position:relative;
}

video{
    width:100%;
    background:black;
    border-radius:8px;
}

.target{
    position:absolute;
    left:50%;
    top:50%;
    width:20px;
    height:20px;
    border:2px solid lime;
    transform:translate(-50%,-50%);
}

canvas{
    width:100%;
    height:160px;
    background:black;
    border-radius:8px;
    margin-top:8px;
}

.control-panel{
    margin-top:10px;
}

.control-panel label{
    display:block;
    margin:10px 0;
}

.control-panel span{
    font-weight:bold;
}

.stats{
    margin-top:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:4px;
}

.card{
    background:#222;
    padding:6px;
    border-radius:6px;
    font-size:12px;
}

.status-on{
    color:#00ff55;
    font-weight:bold;
}

.status-off{
    color:#ff5555;
    font-weight:bold;
}

input[type=range]{
    width:100%;
}

</style>
</head>
<body>

<h2>LED Detector</h2>

<button id="startBtn">
カメラ開始
</button>

<div class="video-wrap">

    <video
        id="video"
        autoplay
        playsinline>
    </video>

    <div class="target"></div>

</div>

<canvas
    id="graph"
    width="800"
    height="200">
</canvas>

<div class="control-panel">

    <label>
        ROIサイズ :
        <span id="roiValue">20</span> px
        <input
            type="range"
            id="roiSize"
            min="3"
            max="50"
            value="20">
    </label>

    <label>
        閾値 :
        <span id="thresholdValue">80</span>
        <input
            type="range"
            id="threshold"
            min="0"
            max="255"
            value="80">
    </label>

</div>

<div class="stats">

    <div class="card">
        輝度<br>
        <span id="brightness">0</span>
    </div>

    <div class="card">
        状態<br>
        <span id="state">---</span>
    </div>

    <div class="card">
        差分<br>
        <span id="diff">0</span>
    </div>

    <div class="card">
        FPS<br>
        <span id="fps">---</span>
    </div>

    <div class="card">
        周期<br>
        <span id="period">---</span>
    </div>

    <div class="card">
        周波数<br>
        <span id="freq">---</span>
    </div>

</div>

<script>

const video =
document.getElementById("video");

const graph =
document.getElementById("graph");

const ctx =
graph.getContext("2d");

const workCanvas =
document.createElement("canvas");

const workCtx =
workCanvas.getContext("2d");

const thresholdSlider =
document.getElementById("threshold");

const thresholdValue =
document.getElementById(
"thresholdValue"
);

const roiSlider =
document.getElementById("roiSize");

const roiValue =
document.getElementById(
"roiValue"
);

const target =
document.querySelector(".target");

let history = [];
let transitions = [];
